condition_predict:
  - _target_: concdvae.pl_modules.PreCondition.ClassConditionPredict
    condition_name: spacegroup
    n_type: 231
    latent_dim: ${model.latent_dim}
    hidden_dim: 4
    n_layers: 1
    drop: 0.2
  
  - _target_: concdvae.pl_modules.PreCondition.ScalarConditionPredict
    condition_name: formation
    condition_min: -5.0
    condition_max: 1.0
    latent_dim: ${model.latent_dim}
    hidden_dim: 256
    out_dim: 1
    n_layers: 2
    
